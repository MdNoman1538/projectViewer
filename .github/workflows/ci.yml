name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Ruff lint
        run: uv run --frozen --only-group dev ruff check .
      - name: Ruff format check
        run: uv run --frozen --only-group dev ruff format --check .
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install (exactly as locked)
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install (exactly as locked)
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
